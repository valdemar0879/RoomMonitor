<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Webserver</title>
    <link rel="stylesheet" href="Stylesheet.css" />
  </head>
  <body>
    <main class="container">
      <h1>Room Monitor</h1>
      <section class="room-panel" aria-live="polite">
        <div class="room-panel-header">
          <div>
            <select id="room-select" aria-label="Choose a room">
              <option value="room-1">Room 1</option>
              <option value="room-2">Room 2</option>
            </select>
          </div>
        </div>

        <figure class="room-figure">
          <img id="room-image" src="RoomSketchV1.jpg" alt="Room 1" />
          <span id="temperature-t1" class="temperature-box temp-t1">-- C</span>
          <span id="temperature-t2" class="temperature-box temp-t2">-- C</span>
          <span id="temperature-t3" class="temperature-box temp-t3">-- C</span>
          <span id="temperature-t4" class="temperature-box temp-t4">-- C</span>
        </figure>

        <div class="chart-section">
          <canvas id="temperature-chart" class="chart-canvas" aria-label="Room 1 temperature over time"></canvas>
          <div class="chart-legend" aria-label="Temperature sensor legend">
            <span><i class="legend-swatch sensor-t1"></i>T1</span>
            <span><i class="legend-swatch sensor-t2"></i>T2</span>
            <span><i class="legend-swatch sensor-t3"></i>T3</span>
            <span><i class="legend-swatch sensor-t4"></i>T4</span>
          </div>
          <canvas id="radiator-chart" class="chart-canvas" aria-label="Room 1 radiator opening over time"></canvas>
          <div class="chart-legend" aria-label="Radiator legend">
            <span><i class="legend-swatch radiator-big"></i>Big radiator</span>
            <span><i class="legend-swatch radiator-small"></i>Small radiator</span>
          </div>
        </div>
      </section>
    </main>
    <script>
      const roomData = {
        "room-1": {
          name: "Room 1",
          image: "RoomSketchV1.jpg",
          sensorFiles: ["room-1/T1.csv", "room-1/T2.csv", "room-1/T3.csv", "room-1/T4.csv"],
          radiatorFiles: ["room-1/big-radiator.csv", "room-1/small-radiator.csv"],
          fallback: [
            [20.1, 20.7, 21.4, 21.2, 22.0, 21.5, 21.8],
            [19.4, 20.0, 20.8, 20.5, 21.1, 20.9, 21.3],
            [21.2, 21.5, 21.8, 22.1, 22.4, 22.0, 22.3],
            [18.8, 19.2, 19.7, 19.5, 20.0, 20.2, 20.1],
          ],
        },
        "room-2": {
          name: "Room 2",
          image: "RoomSketchV1.jpg",
          sensorFiles: ["room-2/T1.csv", "room-2/T2.csv", "room-2/T3.csv", "room-2/T4.csv"],
          radiatorFiles: ["room-2/big-radiator.csv", "room-2/small-radiator.csv"],
          fallback: [
            [18.9, 19.4, 19.8, 20.1, 20.0, 20.6, 20.3],
            [19.1, 19.7, 20.0, 20.4, 20.2, 20.8, 20.6],
            [17.9, 18.4, 18.8, 19.0, 19.3, 19.1, 19.5],
            [20.0, 20.2, 20.6, 20.5, 20.9, 21.0, 21.2],
          ],
        },
      };

      const sensorColors = ["#2374ab", "#d66b2f", "#3a8f5b", "#8957a8"];
      const roomSelect = document.querySelector("#room-select");
      const roomImage = document.querySelector("#room-image");
      const temperatureReadings = [
        document.querySelector("#temperature-t1"),
        document.querySelector("#temperature-t2"),
        document.querySelector("#temperature-t3"),
        document.querySelector("#temperature-t4"),
      ];
      const chart = document.querySelector("#temperature-chart");
      const radiatorChart = document.querySelector("#radiator-chart");
      let activeSeries = [];
      let activeRadiatorSeries = [];
      let roomLoadId = 0;

      function parseSensorCsv(csvText) {
        const rows = csvText.trim().split(/\r?\n/).filter(Boolean);
        const firstColumns = rows[0].split(",").map((column) => column.trim().toLowerCase());
        const hasHeader = firstColumns.includes("temp") && firstColumns.includes("time");
        const temperatureIndex = hasHeader ? firstColumns.indexOf("temp") : 0;
        const timeIndex = hasHeader ? firstColumns.indexOf("time") : 1;
        if (hasHeader) rows.shift();

        return rows.map((row) => {
          const columns = row.split(",");
          return {
            temperature: Number.parseFloat(columns[temperatureIndex]),
            time: columns[timeIndex].trim(),
          };
        }).filter((point) => Number.isFinite(point.temperature) && point.time);
      }

      function parseRadiatorCsv(csvText) {
        const rows = csvText.trim().split(/\r?\n/).filter(Boolean);
        const firstColumns = rows[0].split(",").map((column) => column.trim().toLowerCase());
        const hasHeader = firstColumns.includes("opening") || firstColumns.includes("percentage");
        const valueIndex = hasHeader ? (firstColumns.indexOf("opening") !== -1 ? firstColumns.indexOf("opening") : firstColumns.indexOf("percentage")) : 0;
        const timeIndex = hasHeader ? firstColumns.indexOf("time") : 1;
        if (hasHeader) rows.shift();

        return rows.map((row) => {
          const columns = row.split(",");
          return {
            value: Number.parseFloat(columns[valueIndex]),
            time: columns[timeIndex].trim(),
          };
        }).filter((point) => Number.isFinite(point.value) && point.time);
      }

      async function loadSensorData(room) {
        const responses = await Promise.all(room.sensorFiles.map((file) => fetch(file)));
        if (responses.some((response) => !response.ok)) throw new Error("Sensor CSV unavailable");
        return Promise.all(responses.map((response) => response.text())).then((files) => files.map(parseSensorCsv));
      }

      async function loadRadiatorData(room) {
        const responses = await Promise.all(room.radiatorFiles.map((file) => fetch(file)));
        if (responses.some((response) => !response.ok)) throw new Error("Radiator CSV unavailable");
        const files = await Promise.all(responses.map((response) => response.text()));
        return files.map(parseRadiatorCsv);
      }

      function makeFallbackSeries(room) {
        const times = ["12:00", "14:00", "16:00", "18:00", "20:00", "22:00", "00:00"];
        return room.fallback.map((temperatures) => temperatures.map((temperature, index) => ({
          temperature,
          time: times[index],
        })));
      }

      function makeFallbackRadiatorSeries() {
        const times = ["12:00", "14:00", "16:00", "18:00", "20:00", "22:00", "00:00"];
        return [
          [0.85, 0.72, 0.65, 0.55, 0.68, 0.78, 0.82],
          [0.42, 0.35, 0.28, 0.2, 0.3, 0.38, 0.45],
        ].map((values) => values.map((value, index) => ({ value, time: times[index] })));
      }

      function updateTemperatureReadings(series) {
        series.forEach((sensor, index) => {
          const latestReading = sensor.at(-1);
          const value = latestReading ? `${latestReading.temperature.toFixed(1)} C` : "-- C";
          temperatureReadings[index].textContent = `T${index + 1}: ${value}`;
        });
      }

      temperatureReadings.forEach((reading) => {
        reading.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          reading.setPointerCapture(event.pointerId);
          const figureBounds = document.querySelector(".room-figure").getBoundingClientRect();

          function moveReading(moveEvent) {
            const x = ((moveEvent.clientX - figureBounds.left) / figureBounds.width) * 100;
            const y = ((moveEvent.clientY - figureBounds.top) / figureBounds.height) * 100;
            reading.style.left = `${Math.max(0, Math.min(100, x))}%`;
            reading.style.top = `${Math.max(0, Math.min(100, y))}%`;
            reading.style.right = "auto";
            reading.style.bottom = "auto";
          }

          function stopMoving() {
            reading.removeEventListener("pointermove", moveReading);
            reading.removeEventListener("pointerup", stopMoving);
            reading.removeEventListener("pointercancel", stopMoving);
          }

          reading.addEventListener("pointermove", moveReading);
          reading.addEventListener("pointerup", stopMoving);
          reading.addEventListener("pointercancel", stopMoving);
        });
      });

      function prepareChartCanvas(canvas, context) {
        const bounds = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.round(bounds.width));
        const height = Math.max(1, Math.round(bounds.height));
        const scale = window.devicePixelRatio || 1;
        const pixelWidth = Math.round(width * scale);
        const pixelHeight = Math.round(height * scale);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        context.setTransform(scale, 0, 0, scale, 0, 0);
        return { width, height };
      }

      function drawTemperatureChart(series) {
        if (!series.length || !series.some((sensor) => sensor.length)) return;

        const context = chart.getContext("2d");
        const { width, height } = prepareChartCanvas(chart, context);
        const padding = { top: 20, right: 20, bottom: 35, left: 42 };
        const temperatures = series.flat().map((point) => point.temperature);
        const minimum = Math.floor(Math.min(...temperatures) - 1);
        const maximum = Math.ceil(Math.max(...temperatures) + 1);
        const longestSeries = Math.max(...series.map((sensor) => sensor.length));

        context.clearRect(0, 0, width, height);
        context.font = "12px Times New Roman";
        context.fillStyle = "#555555";
        context.strokeStyle = "#dddddd";
        context.lineWidth = 1;

        for (let value = minimum; value <= maximum; value += 1) {
          const y = padding.top + ((maximum - value) / (maximum - minimum)) * (height - padding.top - padding.bottom);
          context.beginPath();
          context.moveTo(padding.left, y);
          context.lineTo(width - padding.right, y);
          context.stroke();
          context.fillText(`${value} C`, 4, y + 4);
        }

        series.forEach((sensor, sensorIndex) => {
          context.strokeStyle = sensorColors[sensorIndex];
          context.fillStyle = sensorColors[sensorIndex];
          context.lineWidth = 3;
          context.beginPath();
          sensor.forEach((point, index) => {
            const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
            const y = padding.top + ((maximum - point.temperature) / (maximum - minimum)) * (height - padding.top - padding.bottom);
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();

          sensor.forEach((point, index) => {
            const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
            const y = padding.top + ((maximum - point.temperature) / (maximum - minimum)) * (height - padding.top - padding.bottom);
            context.beginPath();
            context.arc(x, y, 4, 0, Math.PI * 2);
            context.fill();
          });
        });

        context.fillStyle = "#555555";
        const labels = series[0].map((point) => point.time);
        [0, Math.floor((labels.length - 1) / 2), labels.length - 1].forEach((index) => {
          const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
          context.fillText(labels[index], x - 12, height - 12);
        });
      }

      function drawRadiatorChart(series) {
        if (!series.length || !series.some((radiator) => radiator.length)) return;

        const context = radiatorChart.getContext("2d");
        const { width, height } = prepareChartCanvas(radiatorChart, context);
        const padding = { top: 20, right: 20, bottom: 35, left: 42 };
        const longestSeries = Math.max(...series.map((radiator) => radiator.length));
        const colors = ["#c74343", "#e09b2d"];

        context.clearRect(0, 0, width, height);
        context.font = "12px Times New Roman";
        context.fillStyle = "#555555";
        context.strokeStyle = "#dddddd";
        context.lineWidth = 1;

        for (let value = 0; value <= 1; value += 0.2) {
          const y = padding.top + ((1 - value) / 1) * (height - padding.top - padding.bottom);
          context.beginPath();
          context.moveTo(padding.left, y);
          context.lineTo(width - padding.right, y);
          context.stroke();
          context.fillText(value.toFixed(2), 8, y + 4);
        }

        series.forEach((radiator, radiatorIndex) => {
          context.strokeStyle = colors[radiatorIndex];
          context.fillStyle = colors[radiatorIndex];
          context.lineWidth = 3;
          context.beginPath();
          radiator.forEach((point, index) => {
            const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
            const y = padding.top + (1 - point.value) * (height - padding.top - padding.bottom);
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();

          radiator.forEach((point, index) => {
            const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
            const y = padding.top + (1 - point.value) * (height - padding.top - padding.bottom);
            context.beginPath();
            context.arc(x, y, 4, 0, Math.PI * 2);
            context.fill();
          });
        });

        context.fillStyle = "#555555";
        const labels = series[0].map((point) => point.time);
        [0, Math.floor((labels.length - 1) / 2), labels.length - 1].forEach((index) => {
          const x = padding.left + (index / (longestSeries - 1)) * (width - padding.left - padding.right);
          context.fillText(labels[index], x - 12, height - 12);
        });
      }

      async function showRoom(roomKey) {
        const loadId = ++roomLoadId;
        const room = roomData[roomKey];
        roomImage.src = room.image;
        roomImage.alt = room.name;
        chart.setAttribute("aria-label", `${room.name} temperature over time`);
        try {
          const sensorSeries = await loadSensorData(room);
          if (loadId === roomLoadId) activeSeries = sensorSeries;
        } catch {
          if (loadId === roomLoadId) activeSeries = makeFallbackSeries(room);
        }
        try {
          const radiatorSeries = await loadRadiatorData(room);
          if (loadId === roomLoadId) activeRadiatorSeries = radiatorSeries;
        } catch {
          if (loadId === roomLoadId) activeRadiatorSeries = makeFallbackRadiatorSeries();
        }
        if (loadId !== roomLoadId) return;
        updateTemperatureReadings(activeSeries);
        drawTemperatureChart(activeSeries);
        drawRadiatorChart(activeRadiatorSeries);
      }

      roomSelect.addEventListener("change", () => {
        showRoom(roomSelect.value);
      });

      window.addEventListener("resize", () => {
        drawTemperatureChart(activeSeries);
        drawRadiatorChart(activeRadiatorSeries);
      });
      showRoom(roomSelect.value);
    </script>
  </body>
</html>
