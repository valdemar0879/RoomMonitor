<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Webserver</title>
    <link rel="stylesheet" href="Stylesheet.css" />
  </head>
  <body>
    <main class="container">
      <h1>Room Monitor Test page</h1>
      <p>Pictures below display the current status of rooms 1 and 2.</p>
      <label for="room-select">Choose a room:</label>
      <select id="room-select">
        <option value="room-1" data-image="Brick.jpg">Room 1</option>
        <option value="room-2" data-image="Brick.jpg">Room 2</option>
      </select>

      <figure class="room-figure">
        <img id="room-image" src="Brick.jpg" alt="Room 1" />
        <figcaption id="room-caption">Room 1</figcaption>
      </figure>
    </main>
    <script>
      const roomSelect = document.querySelector("#room-select");
      const roomImage = document.querySelector("#room-image");
      const roomCaption = document.querySelector("#room-caption");

      roomSelect.addEventListener("change", () => {
        const selectedRoom = roomSelect.selectedOptions[0];
        roomImage.src = selectedRoom.dataset.image;
        roomImage.alt = selectedRoom.textContent;
        roomCaption.textContent = selectedRoom.textContent;
      });
    </script>
  </body>
</html>
